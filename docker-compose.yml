services:
  korabot:
    build: .
    container_name: korabot
    restart: unless-stopped
    ports:
      - "3120:3120"
    volumes:
      - korabot-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - KORA_STORAGE_PATH=/data
      - NODE_ENV=production
      - SANDBOX_DOCKER_VOLUME=korabot-data
      # Base URL for reverse proxy (HTTPS)
      # - KORA_BASE_URL=https://your-domain.com
      # SMTP for email verification
      # - SYSTEM_SMTP_HOST=smtp.example.com
      # - SYSTEM_SMTP_PORT=587
      # - SYSTEM_SMTP_FROM=noreply@example.com
      # - SYSTEM_SMTP_SECURE=true
      # LLM provider keys
      # - OPENAI_API_KEY=sk-...
      # - ANTHROPIC_API_KEY=sk-ant-...
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3120/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  korabot-data:
    driver: local
